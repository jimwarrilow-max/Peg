name: Peg — evening forecast

# Started on time at 17:00 UK time by an outside scheduler (cron-job.org)
# through workflow_dispatch — GitHub's own schedule often runs hours late.
# See docs/scheduling.md.
on:
  workflow_dispatch:
  schedule:
    # Backup only: if the outside scheduler did not run, this sends the
    # forecast late rather than not at all. If the forecast was already
    # sent, run.py stops without sending again.
    - cron: '30 17 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Shared with peg-outcome.yml: both workflows commit log.csv, and a
# concurrent commit race loses one side's push. Serialise them.
concurrency:
  group: peg-commit
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the prediction log

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Outcome capture lives in its own frequent workflow (peg-outcome.yml).
      - name: Send evening forecast
        env:
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: python run.py

      - name: Commit log
        uses: ./.github/actions/commit-log
        with:
          prefix: log
          files: log.csv
